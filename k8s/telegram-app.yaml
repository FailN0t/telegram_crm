apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-sessions-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-app
  template:
    metadata:
      labels:
        app: telegram-app
    spec:
      containers:
        - name: app
          image: your-registry/telegram-app:latest
          envFrom:
            - secretRef:
                name: telegram-app-secrets
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: sessions
              mountPath: /app/sessions
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: telegram-sessions-pvc
