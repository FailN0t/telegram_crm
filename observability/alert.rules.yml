groups:
  - name: app-health
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "App is down"
          description: "No response from /metrics for 1m"

      - alert: High5xxRate
        expr: increase(http_requests_total{status=~"5.."}[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate"
          description: "More than 5 server errors in last 5m"
